name: authorization-grants-chain

# Shared settings for both ledger replicas. Every node must agree on the
# genesis block, so the root ADMIN (the "chief" demo user) is set here.
x-chain-node: &chain-node
  build: ./chain-node
  restart: unless-stopped
  environment: &chain-env
    DIFFICULTY: "3"
    GENESIS_TIME: "1767225600"
    GENESIS_ADMINS: 00000000-0000-4000-8000-000000000001

services:
  node1:
    <<: *chain-node
    environment:
      <<: *chain-env
      NODE_ID: node1
      PEERS: http://node2:8080
    ports: ["8081:8080"]
    volumes: [node1-data:/data]

  node2:
    <<: *chain-node
    environment:
      <<: *chain-env
      NODE_ID: node2
      PEERS: http://node1:8080
    ports: ["8082:8080"]
    volumes: [node2-data:/data]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agc
      POSTGRES_PASSWORD: agc
      POSTGRES_DB: agc
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agc"]
      interval: 2s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://agc:agc@db:5432/agc?sslmode=disable
      CHAIN_NODES: node1=http://node1:8080,node2=http://node2:8080
      JWT_SECRET: demo-only-secret
      SEED_GRANTS: "true"
    depends_on:
      db: { condition: service_healthy }
      node1: { condition: service_started }
      node2: { condition: service_started }

volumes:
  node1-data:
  node2-data:
  db-data:
